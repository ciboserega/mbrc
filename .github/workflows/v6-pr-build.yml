name: V6 pull request build

on:
  pull_request:
    branches: [main, development]
  push:
    branches: ["feature/protocol-v6-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build compatibility debug APK (target SDK 35)
        run: ./gradlew assembleGithubDebug -PcompatTargetSdk=35 --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mbrc-compat-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
