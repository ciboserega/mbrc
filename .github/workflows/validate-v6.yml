name: Validate V6 changes

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - feature/protocol-v6-http-rpc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test networking and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK platform
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          ln -sfn android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run networking tests
        run: ./gradlew :core:networking:testDebugUnitTest --no-daemon --stacktrace

      - name: Build GitHub debug APK
        run: ./gradlew :app:assembleGithubDebug --no-daemon --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mbrc-v6-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 14
